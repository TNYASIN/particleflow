apiVersion: v1
kind: Pod
metadata:
  name: build-tfds-muoncollider
  namespace: muoncollider-ml
spec:
  restartPolicy: Never
  containers:
    - name: builder
      image: tensorflow/tensorflow:2.14.0
      command: ["/bin/bash", "-c"]
      args:
        - |
          pip install -q awkward pyarrow "tensorflow-datasets==4.9.3" "tensorflow-metadata==1.14.0" "protobuf>=3.20.3,<5.0.0" && \
          python /data/users/tanya/particleflow/scripts/nrp/build_tfds.py \
            /data/users/tanya/tfds \
            /data/ttbar_reco \
            /data/muoncollider_all
      resources:
        requests:
          cpu: "4"
          memory: "16Gi"
        limits:
          cpu: "8"
          memory: "32Gi"
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: muon-project-data
