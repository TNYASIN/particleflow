## Smoke test pod for attention mechanism - figuring out batch size
apiVersion: v1
kind: Pod
metadata:
  name: smoke-test-attention
  namespace: muoncollider-ml
spec:
  restartPolicy: Never
  nodeSelector:
    nvidia.com/gpu.product: NVIDIA-A10
  containers:
    - name: trainer
      image: pytorch/pytorch:2.3.0-cuda12.1-cudnn8-runtime
      command: ["/bin/bash", "-c"]
      args:
        - |
          apt-get update -qq && apt-get install -y -qq gcc g++ && \
          pip install -q tensorflow==2.14.0 "tensorflow-datasets==4.9.3" "tensorflow-metadata==1.14.0" "protobuf>=3.20.3,<5.0.0" awkward pyarrow fastjet mplhep && \
          pip install -q -r /data/users/tanya/particleflow/requirements.txt && \
          export PYTHONPATH=/data/users/tanya/particleflow && \
          mkdir -p /data/users/tanya/runs/smoke-test && \
          python /data/users/tanya/particleflow/mlpf/pipeline.py \
            --config /data/users/tanya/particleflow/parameters/pytorch/pyg-muoncollider.yaml \
            --data-dir /data/users/tanya/tfds \
            --experiment-dir /data/users/tanya/runs/smoke-test \
            train \
            --gpus 1 \
            --conv-type attention \
            --gpu-batch-multiplier 15 \
            --num-steps 300
      resources:
        requests:
          cpu: "1"
          memory: "4Gi"
          nvidia.com/gpu: "1"
        limits:
          cpu: "2"
          memory: "8Gi"
          nvidia.com/gpu: "1"
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: muon-project-data
